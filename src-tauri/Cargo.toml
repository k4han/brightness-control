[package]
name = "brightness-control"
version = "0.1.0"
description = "Lightweight Windows Screen Brightness Control application supporting laptop and external monitors"
authors = ["k4han"]
edition = "2021"
license = "MIT"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winapi = { version = "0.3", features = [
    "winuser", "windef", "minwindef", "winnt", "wingdi",
    "physicalmonitorenumerationapi", "highlevelmonitorconfigurationapi", "lowlevelmonitorconfigurationapi", "errhandlingapi",
    "wbemcli", "combaseapi", "oleauto", "oaidl", "objbase"
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
