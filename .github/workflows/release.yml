name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version for release (e.g. v0.1.0)'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build Windows Installers
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app & Publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          releaseName: 'Release ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            ## Brightness Control ${{ github.event.inputs.tag || github.ref_name }}
            
            ### 📥 Windows Installers:
            - **.exe** (NSIS Setup Installer): Standard standalone setup wizard (Recommended).
            - **.msi** (WiX Installer): Windows Installer package for enterprise deployment / GPO / Intune.
          releaseDraft: false
          prerelease: false
          args: --bundles msi,nsis

      - name: Upload installers to Workflow Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brightness-control-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
